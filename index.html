<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Taboo Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="game-container">
    <div class="fixed-header">
      <div class="game-info">
        <div class="round-info">Round: <span id="round-count">1</span></div>
        <div class="timer-display">
          Time: <span id="timer-count">60</span>s
        </div>
        <div class="score">Score: <span id="score">0</span></div>
      </div>
      <div class="timer-progress">
        <div class="timer-bar" id="timer-bar"></div>
      </div>
      
      <div class="card" id="card">
        <div class="word-label">Target Word</div>
        <div class="target-word" id="target-word">COFFEE</div>
        <div class="word-label">Taboo Words</div>
        <div class="taboo-words" id="taboo-words">
          <div class="taboo-word forbidden">Drink</div>
          <div class="taboo-word forbidden">Cup</div>
          <div class="taboo-word forbidden">Bean</div>
          <div class="taboo-word forbidden">Caffeine</div>
          <div class="taboo-word forbidden">Morning</div>
          <div class="taboo-word forbidden">Brew</div>
          <div class="taboo-word forbidden">Hot</div>
        </div>
      </div>
    </div>
    
    <div class="feedback" id="feedback"></div>
    
    <div class="conversation-container" id="conversation">
      <!-- Conversation messages will be added here -->
    </div>
    
    <div class="input-area">
      <div class="taboo-warning" id="taboo-warning">Taboo word detected!</div>
      <input type="text" id="hint-input" placeholder="Enter your hint here..." autocomplete="off">
      <button id="submit-hint">Submit</button>
    </div>
    
    <div class="controls">
      <button id="new-word" class="game-button">New Word</button>
      <button id="skip-word" class="game-button skip-button">Skip Word</button>
    </div>
  </div>

  <script src="js/game-data.js"></script>
  <script src="js/ai-logic.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
